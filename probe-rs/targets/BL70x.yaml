name: BL702/BL704/BL706
variants:
- name: BL702
  cores:
  - name: main
    type: riscv
    core_access_options: !Riscv
      hart_id: 0
  memory_map:
  - !Ram
    name: TCM
    range:
      start: 0x22010000
      end: 0x22020000
    cores:
    - main
  - !Ram
    name: OCRAM
    range:
      start: 0x22020000
      end: 0x2202e000
    cores:
    - main
  - !Generic
    name: FLASH_XIP
    range:
      start: 0x23000000
      end: 0x24000000
    cores:
    - main
    access:
      write: false
      boot: true
  - !Ram
    name: WRAM
    range:
      start: 0x42020000
      end: 0x4202e000
    cores:
    - main
    is_alias: true
  jtag:
    scan_chain:
    - ir_len: 5
- name: BL704
  cores:
  - name: main
    type: riscv
    core_access_options: !Riscv
      hart_id: 0
  memory_map:
  - !Ram
    name: TCM
    range:
      start: 0x22010000
      end: 0x22020000
    cores:
    - main
  - !Ram
    name: OCRAM
    range:
      start: 0x22020000
      end: 0x2202e000
    cores:
    - main
  - !Generic
    name: FLASH_XIP
    range:
      start: 0x23000000
      end: 0x24000000
    cores:
    - main
    access:
      write: false
      boot: true
  - !Ram
    name: WRAM
    range:
      start: 0x42020000
      end: 0x4202e000
    cores:
    - main
    is_alias: true
  jtag:
    scan_chain:
    - ir_len: 5
- name: BL706
  cores:
  - name: main
    type: riscv
    core_access_options: !Riscv
      hart_id: 0
  memory_map:
  - !Ram
    name: TCM
    range:
      start: 0x22010000
      end: 0x22020000
    cores:
    - main
  - !Ram
    name: OCRAM
    range:
      start: 0x22020000
      end: 0x2202e000
    cores:
    - main
  - !Nvm
    name: FLASH
    range:
      start: 0x23000000
      end: 0x23100000
    cores:
    - main
    access:
      boot: true
  - !Ram
    name: WRAM
    range:
      start: 0x42020000
      end: 0x4202e000
    cores:
    - main
    is_alias: true
  flash_algorithms:
  - bl706-mxic-1m
  jtag:
    scan_chain:
    - ir_len: 5
flash_algorithms:
- name: bl706-mxic-1m
  description: BL706 Macronix 1 MiB SPI flash
  default: true
  instructions: 
  load_address: 0x22010010
  pc_init: 0x78
  pc_uninit: 0x310
  pc_program_page: 0x1b6
  pc_erase_sector: 0x0
  pc_read: 0x26c
  vendor_functions:
    JedecId: 0x314
  data_section_offset: 0xb40
  flash_properties:
    address_range:
      start: 0x23000000
      end: 0x23100000
    page_size: 0x100
    erased_byte_value: 0xff
    program_page_timeout: 100
    erase_sector_timeout: 3000
    sectors:
    - size: 0x1000
      address: 0x0
  cores:
  - main
